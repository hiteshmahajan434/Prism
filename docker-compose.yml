services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: prism-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: prism_user
      POSTGRES_PASSWORD: prism_dev_password
      POSTGRES_DB: prism_db

    ports:
      - "5432:5432"

    volumes:
      - prism_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U prism_user -d prism_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prism_postgres_data:
  